<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" fill="none" stroke="#fffff4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Section divider: the lozenge of ornament.svg in the middle, with long arms that end in a curl.
       Only the left half is drawn; the right half is its mirror image. -->
  <path d="M200 6 L210 30 L200 54 L190 30 Z"/>
  <path d="M200 15 L205 30 L200 45 L195 30 Z"/>
  <circle cx="200" cy="30" r="2.6" fill="#fffff4" stroke="none"/>
  <g id="half">
    <!-- scroll next to the lozenge -->
    <path d="M190 30 C181 30 178 20 168 20 C160 20 157 28 162 31.5 C166 34 171 31 169 27.5"/>
    <path d="M186 22 C182 16 176 14 172 16"/>
    <path d="M182 38 C178 44 172 46 166 44"/>
    <!-- long arm, ending in a curl that turns upwards -->
    <path d="M164 38 C150 38 140 30 120 30 C100 30 90 36 70 36 C52 36 40 30 40 22 C40 15 46 11 52 11 C58 11 62 15 62 20 C62 24.5 58.5 27 55 27 C52 27 50 25 50 22.5"/>
    <!-- tendril curling downwards, and two small leaves on the arm -->
    <path d="M118 30 C110 40 100 50 88 50 C80 50 77 44 81 41 C84 39 88 41 87 44.5"/>
    <path d="M134 31 C130 23 122 19 113 20"/>
    <path d="M98 33 C94 26 88 23 81 24"/>
    <!-- pearls at the tip -->
    <circle cx="30" cy="31" r="1.9" fill="#fffff4" stroke="none"/>
    <circle cx="21.5" cy="31" r="1.3" fill="#fffff4" stroke="none"/>
  </g>
  <use href="#half" transform="translate(400 0) scale(-1 1)"/>
</svg>
